
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Comisiones</title>
    <link rel="stylesheet" href="ventas.css">
    <script src="utilitarios.js" defer></script>
    <script src="ventas.js" defer></script>
</head>

<body>
    <div class="contenedor">

        <h1>Calculadora de Comisiones</h1>

        <label for="txtSueldoBase">Salario Base:</label>
        <input
            type="text"
            id="txtSueldoBase"
            inputmode="numeric"
            maxlength="6"
            onblur="validarCampo('txtSueldoBase', 'errorSueldoBase')"
        >
        <span id="errorSueldoBase" class="mensaje-error"></span>

        <label for="txtVentas">Número de ventas:</label>
        <input
            type="text"
            id="txtVentas"
            inputmode="numeric"
            maxlength="6"
            onblur="validarCampo('txtVentas', 'errorVentas')"
        >
        <span id="errorVentas" class="mensaje-error"></span>

        <label for="txtPrecio">Precio del producto:</label>
        <input
            type="text"
            id="txtPrecio"
            inputmode="numeric"
            maxlength="6"
            onblur="validarCampo('txtPrecio', 'errorPrecio')"
        >
        <span id="errorPrecio" class="mensaje-error"></span>

        <button type="button" onclick="calcular()">Calcular Comisión</button>

        <h2>Resultados</h2>

        <p>Salario Base: <span id="spSueldoBase"></span></p>
        <p>Comisión: <span id="spComision"></span></p>
        <p>Total: <span id="spTotal"></span></p>

    </div>

</body>
</html>
